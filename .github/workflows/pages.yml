name: Publish Xijian
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 1,4,7 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: node scripts/build-pages.mjs
      - name: Preserve last valid snapshots
        run: git restore --source=HEAD -- docs/data || true
      - name: Refresh public market data
        run: node scripts/refresh-data.mjs || test -f docs/data/index.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
